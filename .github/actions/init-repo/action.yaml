name: Init repo

description: Initialize the workspace for CI tasks by installing dependencies of all packages and building libraries.

runs:
  using: composite
  steps:
    # Only GitHub-hosted runners (the OSS repo, forks) need pnpm bootstrapped;
    # the self-hosted pool already has it on PATH. Skipping the self-installer on
    # the pool avoids the shared-HOME ~/setup-pnpm race that crashed concurrent
    # matrix jobs (ENOTEMPTY). pnpm's shared on-disk store is concurrency-safe.
    - name: Setup pnpm
      if: runner.environment == 'github-hosted'
      uses: pnpm/action-setup@v4

    # No `cache: pnpm`: on the self-hosted pool it races the shared on-disk store
    # (restore/save fights concurrent installs), and the pool keeps that store
    # warm on its own. Hosted runners are ephemeral, so a cache would be cold.
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc

    # Shared turbo cache. On the self-hosted pool every runner service shares one
    # HOME, so task results persist across jobs, runners, and branches; unchanged
    # tasks replay from cache instead of re-executing. Hosted runners (OSS repo,
    # forks) just get a cold per-job dir — same behavior as before. Exported to
    # GITHUB_ENV so the job's later steps (turbo task runs) hit the same cache.
    # The nightly cleanup cron on the runner VM garbage-collects stale entries.
    - name: Configure turbo cache
      run: echo "TURBO_CACHE_DIR=$HOME/.cache/turbo" >> "$GITHUB_ENV"
      shell: bash

    - name: Install workspace deps
      run: pnpm install --frozen-lockfile
      shell: bash

    # Turbo skips packages whose build inputs haven't changed (warm cache), so
    # this is a ~2s replay on most jobs instead of 8 tsc builds every time.
    - name: Build library packages
      run: pnpm exec turbo run build --filter='./libraries/*' --output-logs=errors-only
      shell: bash
