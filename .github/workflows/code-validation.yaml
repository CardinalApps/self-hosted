name: 🛁 1. Code Validation

on:
  push:
    branches:
      - '**'
    paths:
      - 'apps/**'
      - 'config/**'
      - 'libraries/**'
      - 'servers/**'
      - '.github/workflows/code-validation.yaml'
      - '.github/actions/init-repo/**'
      - '.npmrc'
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '!**/*.md'
      - '!**/README*'
      - '!**/.gitignore'
      - '!**/LICENSE*'

# Per-branch concurrency group. Serializes runs of this workflow per ref so two
# pushes don't have overlapping installs on the shared self-hosted pool.
concurrency:
  group: code-validation-${{ github.ref }}
  cancel-in-progress: false

# This workflow runs in the private repo and is published verbatim to the public
# self-hosted repo. The private repo sets the Actions variable CI_RUNNER=self-hosted
# to target its runner pool; anywhere the variable is unset (the public repo, forks)
# falls back to GitHub-hosted runners.
#
# The matrix is limited to packages affected by the push (changed packages plus
# their dependents, resolved through turbo's package graph), and every task runs
# through turbo so unchanged work replays from the shared cache on the runner VM.
# A stage with no affected packages is skipped entirely; the final Code Validation
# job treats skipped stages as passing.
jobs:
  discover:
    name: Discover packages
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      lint-packages: ${{ steps.discover.outputs.lint-packages }}
      typecheck-packages: ${{ steps.discover.outputs.typecheck-packages }}
      unit-packages: ${{ steps.discover.outputs.unit-packages }}
      integration-packages: ${{ steps.discover.outputs.integration-packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so turbo can diff HEAD against the push base.
          fetch-depth: 0

      # Only GitHub-hosted runners need pnpm bootstrapped; the self-hosted pool
      # already has it. See the note in .github/actions/init-repo.
      - name: Setup pnpm
        if: runner.environment == 'github-hosted'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # Resolve the git base for change detection. Prefer the push base
      # (github.event.before); fall back to the merge-base with the default
      # branch when that commit is unusable (new branch, force push). If no
      # base resolves at all, run the full matrix rather than skipping work.
      - name: Resolve diff base
        id: base
        run: |
          BASE="${{ github.event.before }}"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE=$(git merge-base "origin/${{ github.event.repository.default_branch }}" HEAD 2>/dev/null || true)
          fi
          if [[ -n "$BASE" ]]; then
            echo "TURBO_SCM_BASE=$BASE" >> "$GITHUB_ENV"
            echo "affected=--affected" >> "$GITHUB_OUTPUT"
            echo "Diffing against $BASE"
          else
            echo "affected=" >> "$GITHUB_OUTPUT"
            echo "No usable base — running the full matrix"
          fi

      # Emit a JSON array of {name, label} for every package whose task turbo
      # would actually run: affected packages (changed + dependents) that define
      # the script. Dry-run entries without a real script are virtual graph
      # nodes and are filtered out.
      - name: Discover packages
        id: discover
        run: |
          set -o pipefail
          discover() {
            pnpm exec turbo run "$1" ${{ steps.base.outputs.affected }} --dry=json 2>/dev/null \
              | sed -n '/^{/,$p' \
              | jq -c --arg t "$1" '[.tasks[]
                  | select(.task == $t and .command != "<NONEXISTENT>")
                  | {name: .package, label: (.package | sub("^[^/]+/"; ""))}]'
          }
          echo "lint-packages=$(discover lint)" >> $GITHUB_OUTPUT
          echo "typecheck-packages=$(discover typecheck)" >> $GITHUB_OUTPUT
          echo "unit-packages=$(discover test:unit)" >> $GITHUB_OUTPUT
          echo "integration-packages=$(discover test:integration)" >> $GITHUB_OUTPUT

  lint:
    name: "Lint (${{ matrix.package.label }})"
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: discover
    if: ${{ needs.discover.outputs.lint-packages != '[]' }}
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        package: ${{ fromJson(needs.discover.outputs.lint-packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Init repo
        uses: ./.github/actions/init-repo

      - name: Lint
        run: pnpm exec turbo run lint --filter="${{ matrix.package.name }}" -- --max-warnings 0

  typecheck:
    name: "Typecheck (${{ matrix.package.label }})"
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Serialize after lint so only one matrix runs at a time on the shared VM.
    # !failure() (not success()) so this still runs when lint is skipped.
    needs: [discover, lint]
    if: ${{ !failure() && !cancelled() && needs.discover.outputs.typecheck-packages != '[]' }}
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        package: ${{ fromJson(needs.discover.outputs.typecheck-packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Init repo
        uses: ./.github/actions/init-repo

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter="${{ matrix.package.name }}"

  unit:
    name: "Unit (${{ matrix.package.label }})"
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Serialize after typecheck.
    needs: [discover, typecheck]
    if: ${{ !failure() && !cancelled() && needs.discover.outputs.unit-packages != '[]' }}
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        package: ${{ fromJson(needs.discover.outputs.unit-packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Init repo
        uses: ./.github/actions/init-repo

      - name: Unit tests
        run: pnpm exec turbo run test:unit --filter="${{ matrix.package.name }}"

  integration:
    name: "Integration (${{ matrix.package.label }})"
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Serialize after unit.
    needs: [discover, unit]
    if: ${{ !failure() && !cancelled() && needs.discover.outputs.integration-packages != '[]' }}
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        package: ${{ fromJson(needs.discover.outputs.integration-packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Init repo
        uses: ./.github/actions/init-repo

      - name: Integration tests
        run: pnpm exec turbo run test:integration --filter="${{ matrix.package.name }}"

  validate:
    name: Code Validation
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [discover, lint, typecheck, unit, integration]
    if: always()
    steps:
      # Skipped stages are fine (no affected packages); failures and
      # cancellations are not. Discover itself must always succeed.
      - name: Check results
        run: |
          ok() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          if [[ "${{ needs.discover.result }}" != "success" ]] \
             || ! ok "${{ needs.lint.result }}" \
             || ! ok "${{ needs.typecheck.result }}" \
             || ! ok "${{ needs.unit.result }}" \
             || ! ok "${{ needs.integration.result }}"; then
            exit 1
          fi
